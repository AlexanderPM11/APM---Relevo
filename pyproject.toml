[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "relevo-router"
version = "0.1.0"
description = "OpenAI-compatible router for free-tier AI model providers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncmy>=0.2.9,<1.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "PyJWT>=2.9,<3.0",
  "tenacity>=9.0,<10.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
  "python-multipart>=0.0.12,<1.0",
  "email-validator>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "respx>=0.21,<1.0",
  "testcontainers[mysql]>=4.8,<5.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "pre-commit>=4.0,<5.0",
  "types-PyYAML>=6.0",
  "types-python-jose>=3.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
