services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relevo}
      MYSQL_USER: ${MYSQL_USER:-relevo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-too}
      ROUTER_STRATEGY: ${ROUTER_STRATEGY:-priority}
      LAYA_ROUTING_MODE: ${LAYA_ROUTING_MODE:-off}
      LAYA_BASE_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY:-development-laya-internal-key}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - relevo-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    expose:
      - "80"
    networks:
      - relevo-internal

  laya:
    build:
      context: https://github.com/NandhaKishorM/laya.git#v0.3.28
    command: ["laya-serve"]
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: 8000
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_DEFAULT_MODEL: multilingual
      LAYA_MAX_LOADED: "1"
      LAYA_MAX_CONCURRENT: "2"
      LAYA_THREADS: ${LAYA_THREADS:-2}
      LAYA_API_KEY: ${LAYA_API_KEY:-development-laya-internal-key}
      LAYA_JEV_STRICT: "0"
    expose:
      - "8000"
    volumes:
      - laya-cache:/home/laya/.cache/huggingface
    restart: unless-stopped
    networks:
      - relevo-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relevo}
      MYSQL_USER: ${MYSQL_USER:-relevo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-too}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - relevo-internal

networks:
  relevo-internal:
    driver: bridge

volumes:
  mysql-data:
  laya-cache:
