services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relevo}
      MYSQL_USER: ${MYSQL_USER:-relevo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-too}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - relevo-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:8080:80"
    expose:
      - "80"
    networks:
      - relevo-internal

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-relevo}
      MYSQL_USER: ${MYSQL_USER:-relevo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-too}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - relevo-internal

networks:
  relevo-internal:
    driver: bridge

volumes:
  mysql-data:
