      - name: command-r7b-12-2024
        alias: cohere-free
        priority: 45
        context_max: 128000
        capabilities: [text, tools]
        limits: []
  - slug: mistral
    name: Mistral
    base_url: https://api.mistral.ai/v1
    env_key_name: MISTRAL_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
