  - slug: kilo
    name: Kilo Gateway
    base_url: https://api.kilo.ai/api/gateway
    env_key_name: KILO_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
    models:
      - name: kilo-auto/free
        alias: kilo-free
        priority: 25
        weight: 2
        context_max: 128000
