# Free-first catalog, checked 2026-10-08. Quotas and model availability change;
# review provider dashboards and terms before relying on a model.
providers:
  - slug: groq
    name: Groq
    base_url: https://api.groq.com/openai/v1
    env_key_name: GROQ_API_KEY
    requires_card: false
    requires_phone: true
    uses_data_for_training: unknown
    tier: 1
    adapter: openai
    models:
      - name: openai/gpt-oss-120b
        alias: fast
        priority: 10
        weight: 3
        context_max: 32768
        capabilities: [text, tools, json]
        limits: []
      - name: llama-3.3-70b-versatile
        is_enabled: false
        priority: 1000
        context_max: 32768
        capabilities: [text]
        limits: []
  - slug: cerebras
    name: Cerebras
    base_url: https://api.cerebras.ai/v1
    env_key_name: CEREBRAS_API_KEY
    requires_card: false
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 1
    adapter: openai
    models:
      - name: gpt-oss-120b
        alias: fast
        priority: 20
        weight: 2
        context_max: 8192
        capabilities: [text, tools, json]
        limits: []
  - slug: google-ai-studio
    name: Google AI Studio
    base_url: https://generativelanguage.googleapis.com/v1beta
    env_key_name: GOOGLE_AI_STUDIO_API_KEY
    requires_card: false
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 2
    adapter: google
    models:
      - name: gemini-2.0-flash
        is_enabled: false
        priority: 1000
        context_max: 8192
        capabilities: [text]
        limits: []
      - name: gemini-3.8-flash
        alias: balanced
        priority: 30
        weight: 2
        context_max: 1048576
        capabilities: [text]
        limits: []
  - slug: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    env_key_name: OPENROUTER_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
    models:
      - name: openrouter/free
        alias: free
        priority: 40
        weight: 2
        context_max: 200000
        capabilities: [text, tools, json, vision]
        limits: []
  - slug: cloudflare
    name: Cloudflare Workers AI
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    env_key_name: CLOUDFLARE_API_TOKEN
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 2
    adapter: openai
    models:
      - name: "@cf/meta/llama-3.1-8b-instruct-fp8"
        alias: cloudflare-free
        priority: 35
        context_max: 32000
        capabilities: [text, tools, json]
        limits: []
  - slug: cohere
    name: Cohere
    base_url: https://api.cohere.ai/compatibility/v1
    env_key_name: COHERE_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
