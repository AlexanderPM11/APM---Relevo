# Provider connection metadata. Model inventories are fetched from provider APIs at runtime.
providers:
  - slug: groq
    name: Groq
    base_url: https://api.groq.com/openai/v1
    env_key_name: GROQ_API_KEY
    requires_card: false
    requires_phone: true
    uses_data_for_training: unknown
    tier: 1
    adapter: openai
  - slug: cerebras
    name: Cerebras
    base_url: https://api.cerebras.ai/v1
    env_key_name: CEREBRAS_API_KEY
    requires_card: false
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 1
    adapter: openai
  - slug: google-ai-studio
    name: Google AI Studio
    base_url: https://generativelanguage.googleapis.com/v1beta
    env_key_name: GOOGLE_AI_STUDIO_API_KEY
    requires_card: false
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 2
    adapter: google
  - slug: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    env_key_name: OPENROUTER_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
  - slug: cloudflare
    name: Cloudflare Workers AI
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    env_key_name: CLOUDFLARE_API_TOKEN
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 2
    adapter: openai
  - slug: cohere
    name: Cohere
    base_url: https://api.cohere.ai/compatibility/v1
    env_key_name: COHERE_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
  - slug: mistral
    name: Mistral
    base_url: https://api.mistral.ai/v1
    env_key_name: MISTRAL_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
  - slug: nvidia
    name: NVIDIA NIM
    base_url: https://integrate.api.nvidia.com/v1
    env_key_name: NVIDIA_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
  - slug: kilo
    name: Kilo Gateway
    base_url: https://api.kilo.ai/api/gateway
    env_key_name: KILO_API_KEY
    requires_card: unknown
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 3
    adapter: openai
  - slug: ollama
    name: Ollama
    base_url: http://localhost:11434/v1
    env_key_name: OLLAMA_BASE_URL
    requires_card: false
    requires_phone: false
    uses_data_for_training: false
    tier: 4
    adapter: openai
  - slug: huggingface
    name: Hugging Face Inference Providers
    base_url: https://router.huggingface.co/v1
    env_key_name: HUGGINGFACE_API_KEY
    requires_card: false
    requires_phone: unknown
    uses_data_for_training: unknown
    tier: 4
    adapter: openai
